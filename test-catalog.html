<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Catalog Integration Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 p-10">
    <h1 class="text-2xl font-bold mb-6">Catalog System Verification</h1>
    
    <div class="space-y-4">
        <div id="test-1" class="p-4 bg-white rounded shadow">
            <h3 class="font-bold">Test 1: Fetch Catalog (Real API)</h3>
            <div id="status-1" class="text-gray-500">Running...</div>
        </div>

        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg">
            <div>
                <h3 class="font-bold text-slate-800">Test 2: Render Logic</h3>
                <p class="text-sm text-slate-500">Simulate empty catalog rendering</p>
            </div>
            <div id="status-2" class="text-sm font-mono text-slate-400">WAITING...</div>
        </div>

        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg">
                <div>
                    <h3 class="font-bold text-slate-800">Test 3: Price Format</h3>
                    <p class="text-sm text-slate-500">Check for NaN / Property Name</p>
                </div>
                <div id="status-3" class="text-sm font-mono text-slate-400">WAITING...</div>
            </div>

            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg">
                <div>
                    <h3 class="font-bold text-slate-800">Test 4: Retry Logic</h3>
                    <p class="text-sm text-slate-500">Simulate fetch retries (Mock)</p>
                </div>
                <div id="status-4" class="text-sm font-mono text-slate-400">WAITING...</div>
            </div>
    </div>

    <script>
        // Utility: Mock Sleep
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // Utility: Fetch with Retry (Simulated implementation for test)
        async function fetchWithRetry(url, options = {}, retries = 2, backoff = 500) {
            for (let i = 0; i <= retries; i++) {
                try {
                    // Simulate fetch if url is mock
                    if (url === 'mock-fail') throw new Error('Mock Network Error');
                    if (url === 'mock-success') return { ok: true, json: async () => ({ status: 'success', data: [] }) };
                    
                    const res = await fetch(url, options);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res;
                } catch (err) {
                    if (i === retries) throw err;
                    await sleep(backoff * Math.pow(2, i));
                }
            }
        }

        async function runTests() {
            // Test 1: Real API Call & Data Structure Verification
            try {
                if(typeof SCRIPT_URL === 'undefined') throw new Error("SCRIPT_URL missing");
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_products' })
                });
                const json = await res.json();
                
                let details = [];
                if (Array.isArray(json.data)) details.push(`Found 'data' (${json.data.length} items)`);
                if (Array.isArray(json.available)) details.push(`Found 'available' (${json.available.length} items)`);
                
                if (json.status === 'success' && (Array.isArray(json.data) || Array.isArray(json.available))) {
                    document.getElementById('status-1').innerHTML = `<span class="text-green-600 font-bold">PASS</span> <span class="text-xs text-slate-500">(${details.join(', ')})</span>`;
                } else {
                    throw new Error("Invalid data structure: Missing 'data' or 'available' array");
                }
            } catch (e) {
                document.getElementById('status-1').innerHTML = `<span class="text-red-600 font-bold">FAIL</span>: ${e.message}`;
            }

            // Test 2: Render Logic (Empty Data Fallback)
            try {
                const container = document.createElement('div');
                const products = [];
                if (products.length === 0) {
                    container.innerHTML = "Belum Ada Produk"; // Updated Logic
                }
                if (container.innerHTML.includes("Belum Ada") || container.innerHTML.includes("Katalog sedang")) {
                    document.getElementById('status-2').innerHTML = `<span class="text-green-600 font-bold">PASS</span> (Correctly identified empty state)`;
                } else {
                    throw new Error("Render logic incorrect");
                }
            } catch (e) {
                document.getElementById('status-2').innerHTML = `<span class="text-red-600 font-bold">FAIL</span>: ${e.message}`;
            }

            // Test 3: Price Format Verification (Anti-NaN)
    try {
        if(typeof SCRIPT_URL === 'undefined') throw new Error("SCRIPT_URL missing");
        
        // 3A. Test get_products (Catalog)
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'get_products' })
        });
        const json = await res.json();
        const products = Array.isArray(json.data) ? json.data : (Array.isArray(json.available) ? json.available : []);
        
        let msg = "";
        if (products.length > 0) {
            const p = products[0];
            if (p.hasOwnProperty('harga') && !isNaN(Number(p.harga))) {
                 msg += `Catalog: <span class="text-green-600 font-bold">PASS</span> (harga: ${p.harga})`;
            } else {
                 msg += `Catalog: <span class="text-red-600 font-bold">FAIL</span> (Keys: ${Object.keys(p).join(', ')})`;
            }
            
            // 3B. Test get_product (Detail) - Use the ID from first product
            const resDetail = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_product', id: p.id })
            });
            const jsonDetail = await resDetail.json();
            
            if(jsonDetail.status === 'success' && jsonDetail.data) {
                const d = jsonDetail.data;
                if (d.hasOwnProperty('harga') && !isNaN(Number(d.harga))) {
                     msg += `<br>Detail: <span class="text-green-600 font-bold">PASS</span> (harga: ${d.harga})`;
                } else if (d.hasOwnProperty('price')) {
                     msg += `<br>Detail: <span class="text-yellow-600 font-bold">WARN</span> (Using 'price': ${d.price})`;
                } else {
                     msg += `<br>Detail: <span class="text-red-600 font-bold">FAIL</span> (Missing price/harga)`;
                }
            } else {
                msg += `<br>Detail: <span class="text-red-600 font-bold">FAIL</span> (Fetch Failed)`;
            }
            
            document.getElementById('status-3').innerHTML = msg;

        } else {
            document.getElementById('status-3').innerHTML = `<span class="text-slate-400 font-bold">SKIP</span> (No products to test)`;
        }
    } catch (e) {
        document.getElementById('status-3').innerHTML = `<span class="text-red-600 font-bold">FAIL</span>: ${e.message}`;
    }

            // Test 4: Retry Logic
            try {
                const start = Date.now();
                // Ensure fetchWithRetry is defined or imported. It is defined in script block above.
                // We need to make sure we don't use real SCRIPT_URL for this mock test
                await fetchWithRetry('mock-fail', {}, 2, 200);
                document.getElementById('status-4').innerHTML = `<span class="text-red-600 font-bold">FAIL</span> (Should have thrown error)`;
            } catch (e) {
                const duration = Date.now() - start;
                // 2 retries: wait 200 + 400 = 600ms min
                if (duration > 500) {
                    document.getElementById('status-4').innerHTML = `<span class="text-green-600 font-bold">PASS</span> (Retried correctly, took ${duration}ms)`;
                } else {
                    document.getElementById('status-4').innerHTML = `<span class="text-red-600 font-bold">FAIL</span> (Retry too fast: ${duration}ms)`;
                }
            }
        }

        runTests();
    </script>
</body>
</html>
