<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Logic Unit Tests</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-6">
        <h1 class="text-2xl font-bold mb-6">Unit Tests: Payment Error Handling</h1>
        
        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        // --- MOCK UTILITIES ---
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        
        // Copied from checkout.html (The logic we want to test)
        async function fetchWithRetry(url, options = {}, retries = 3, backoff = 100, timeout = 1000) {
            for (let i = 0; i <= retries; i++) {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), timeout);
                options.signal = controller.signal;

                try {
                    // MOCK FETCH IMPLEMENTATION
                    const response = await mockFetch(url, options, i);
                    clearTimeout(id);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP_ERROR_${response.status}`);
                    }
                    return response;
                } catch (error) {
                    clearTimeout(id);
                    const isLastAttempt = i === retries;
                    
                    let errorType = 'UNKNOWN';
                    if (error.name === 'AbortError') errorType = 'TIMEOUT';
                    else if (error.message.startsWith('HTTP_ERROR')) errorType = 'HTTP';
                    else if (error.name === 'TypeError') errorType = 'NETWORK'; 

                    console.log(`[Test Log] Attempt ${i + 1} failed: ${errorType}`);

                    if (isLastAttempt) {
                        error.type = errorType;
                        throw error;
                    }

                    await sleep(backoff * Math.pow(2, i));
                }
            }
        }

        // --- MOCK SERVER ---
        let mockScenario = 'success';
        
        async function mockFetch(url, options, attempt) {
            await sleep(50); // network delay

            if (mockScenario === 'success') {
                return { ok: true, json: async () => ({ status: 'success' }) };
            }
            
            if (mockScenario === 'timeout') {
                await sleep(2000); // Exceeds 1000ms timeout
                return; // Should be aborted by controller
            }

            if (mockScenario === 'network_error') {
                throw new TypeError("Failed to fetch");
            }

            if (mockScenario === 'http_500') {
                return { ok: false, status: 500 };
            }

            if (mockScenario === 'retry_success') {
                if (attempt < 2) throw new TypeError("Network glitch");
                return { ok: true, json: async () => ({ status: 'success' }) };
            }
        }

        // --- TEST RUNNER ---
        function assert(condition, message) {
            const div = document.createElement('div');
            div.className = condition ? 'p-3 bg-green-50 border border-green-200 rounded text-green-800' : 'p-3 bg-red-50 border border-red-200 rounded text-red-800';
            div.innerHTML = `<strong>${condition ? 'PASS' : 'FAIL'}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
        }

        async function runTests() {
            // Test 1: Success
            mockScenario = 'success';
            try {
                const res = await fetchWithRetry('https://api.test');
                assert(true, "Success scenario should resolve");
            } catch (e) {
                assert(false, "Success scenario failed: " + e.message);
            }

            // Test 2: Timeout
            mockScenario = 'timeout';
            try {
                await fetchWithRetry('https://api.test', {}, 1);
                assert(false, "Timeout scenario should throw");
            } catch (e) {
                assert(e.type === 'TIMEOUT', "Timeout scenario should throw TIMEOUT error. Got: " + e.type);
            }

            // Test 3: Network Error (CORS/Offline)
            mockScenario = 'network_error';
            try {
                await fetchWithRetry('https://api.test', {}, 1);
                assert(false, "Network error should throw");
            } catch (e) {
                assert(e.type === 'NETWORK', "Network error should throw NETWORK error. Got: " + e.type);
            }

            // Test 4: HTTP 500
            mockScenario = 'http_500';
            try {
                await fetchWithRetry('https://api.test', {}, 1);
                assert(false, "HTTP 500 should throw");
            } catch (e) {
                assert(e.type === 'HTTP', "HTTP 500 should throw HTTP error. Got: " + e.type);
            }

            // Test 5: Retry Logic (Fail 2 times, succeed on 3rd)
            mockScenario = 'retry_success';
            try {
                const res = await fetchWithRetry('https://api.test', {}, 3);
                assert(true, "Retry logic should eventually succeed");
            } catch (e) {
                assert(false, "Retry logic failed: " + e.message);
            }
        }

        runTests();
    </script>
</body>
</html>
